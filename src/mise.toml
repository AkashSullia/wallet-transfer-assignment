[tasks]

postgres = "docker run --name walletdb -p 5432:5432 -e POSTGRES_USER=root -e POSTGRES_PASSWORD=secret -d postgres:18.3-alpine || docker start walletdb"

reset-postgres = "docker rm walletdb"

createdb = "docker exec -it walletdb createdb --username=root --owner=root wtx"

dropdb = "docker exec -it walletdb dropdb wtx"

server = "go run main.go"

usedb = "docker exec -it walletdb psql -U root wtx"

[env]
GOOSE_DRIVER = 'postgres'
GOOSE_DBSTRING = 'postgres://root:secret@localhost:5432/wtx'
GOOSE_MIGRATION_DIR = './db/migration'
