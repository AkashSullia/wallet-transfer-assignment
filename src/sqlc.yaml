version: "2"
sql:
  - engine: "postgresql"
    schema: "./db/migration/"
    queries: "./db/queries/"
    gen:
      go:
        sql_package: "pgx/v5"
        package: "db"
        out: "./db/generated/"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: false
        emit_result_struct_pointers: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
overrides:
    go:
      rename:
        itemid: "ItemID"
